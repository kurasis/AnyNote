# Review and render with a private external env file. No production defaults.
x-runtime: &runtime
  image: ${ANYNOTE_API_IMAGE:?immutable API image required}
  user: "${ANYNOTE_UID:-1000}:${ANYNOTE_GID:-1000}"
  entrypoint: [/bin/sh, /opt/anynote/runtime.sh]
  working_dir: /app
  environment: &environment
    APP_ENV: production
    APP_DEBUG: "false"
    ANYNOTE_ACCEL_DELIVERY: "true"
    APP_URL: ${ANYNOTE_API_ISSUER:?exact HTTPS API issuer required}
    ANYNOTE_API_ISSUER: ${ANYNOTE_API_ISSUER}
    ANYNOTE_APP_ORIGIN: ${ANYNOTE_APP_ORIGIN:?exact static HTTPS origin required}
    ANYNOTE_SERVICE_ID: ${ANYNOTE_SERVICE_ID:?independent service ID required}
    ANYNOTE_RP_ID: ${ANYNOTE_RP_ID:?exact static RP required}
    ANYNOTE_OAUTH_PRIVATE_KEY: /run/secrets/oauth_private
    ANYNOTE_OAUTH_PUBLIC_KEY: /run/secrets/oauth_public
    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_DATABASE: anynote
    DB_USERNAME: anynote_runtime
    DB_QUEUE_RETRY_AFTER: "240"
    SESSION_DRIVER: database
    CACHE_STORE: array
    QUEUE_CONNECTION: database
    QUEUE_FAILED_DRIVER: "null"
    LOG_CHANNEL: stderr
  volumes:
    - ${ANYNOTE_DEPLOY_ROOT:?external state directory required}/storage:/app/storage
    - ${ANYNOTE_DEPLOY_ROOT}/secrets/app_key:/run/secrets/app_key:ro
    - ${ANYNOTE_DEPLOY_ROOT}/secrets/database_password:/run/secrets/database_password:ro
    - ${ANYNOTE_DEPLOY_ROOT}/secrets/oauth_private:/run/secrets/oauth_private:ro
    - ${ANYNOTE_DEPLOY_ROOT}/secrets/oauth_public:/run/secrets/oauth_public:ro
  networks: [database]
  read_only: true
  tmpfs: ["/tmp:size=64m,uid=${ANYNOTE_UID:-1000},gid=${ANYNOTE_GID:-1000},mode=0700", "/app/bootstrap/cache:size=8m,uid=${ANYNOTE_UID:-1000},gid=${ANYNOTE_GID:-1000},mode=0700"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  init: true
  stop_grace_period: 190s
  logging: {driver: none}
services:
  db:
    user: "${ANYNOTE_UID:-1000}:${ANYNOTE_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/run/mysqld:uid=${ANYNOTE_UID:-1000},gid=${ANYNOTE_GID:-1000},mode=0700", "/tmp:uid=${ANYNOTE_UID:-1000},gid=${ANYNOTE_GID:-1000},mode=0700"]
    image: mariadb:11.8.9-noble@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    command: [--innodb-flush-log-at-trx-commit=1, --sync-binlog=1, --max-connections=32]
    environment:
      MARIADB_DATABASE: anynote
      MARIADB_USER: anynote_runtime
      MARIADB_PASSWORD_FILE: /run/secrets/database_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/database_root
    volumes:
      - ${ANYNOTE_DEPLOY_ROOT}/database:/var/lib/mysql
      - ${ANYNOTE_DEPLOY_ROOT}/secrets/database_password:/run/secrets/database_password:ro
      - ${ANYNOTE_DEPLOY_ROOT}/secrets/database_root:/run/secrets/database_root:ro
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging: {driver: none}
  api:
    <<: *runtime
    command: [php-fpm, -F]
    networks: [edge, database]
  queue:
    <<: *runtime
    command: [php, artisan, 'queue:work', database, '--sleep=1', '--timeout=150', '--tries=3', '--max-time=3600']
  scheduler:
    <<: *runtime
    command: [php, artisan, 'schedule:work']
  edge:
    image: nginx:1.30.5-trixie@sha256:9bf97bd7714f5e24c1ccd545ecb9eb5435cb6d109c97cebb15e7e455e0239edb
    user: "${ANYNOTE_UID:-1000}:${ANYNOTE_GID:-1000}"
    entrypoint: [nginx, -g, 'daemon off;']
    ports: ["${ANYNOTE_BIND_IP:-127.0.0.1}:${ANYNOTE_HTTPS_PORT:?explicit HTTPS port required}:8443"]
    volumes:
      - ${ANYNOTE_DEPLOY_ROOT}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ANYNOTE_STATIC_ROOT:?independently owned static release required}:/static:ro
      - ${ANYNOTE_DEPLOY_ROOT}/storage/app/private/p16-delivery:/delivery:ro
      - ${ANYNOTE_DEPLOY_ROOT}/tls/operator-ca.crt:/tls/operator-ca.crt:ro
      - ${ANYNOTE_DEPLOY_ROOT}/tls/server.crt:/tls/server.crt:ro
      - ${ANYNOTE_DEPLOY_ROOT}/tls/server.key:/tls/server.key:ro
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:size=96m,uid=${ANYNOTE_UID:-1000},gid=${ANYNOTE_GID:-1000},mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: none}
networks:
  database: {internal: true}
  edge: {}
