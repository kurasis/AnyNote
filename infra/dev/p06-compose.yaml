services:
  auth-php:
    image: anynote-p03-php:8.4.26
    user: "${ANYNOTE_DEV_UID:-1000}:${ANYNOTE_DEV_GID:-1000}"
    environment:
      APP_ENV: testing
      APP_KEY: ${ANYNOTE_DEV_APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://api.anynote.test:18443
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: anynote_p06_tests
      DB_USERNAME: anynote_dev
      DB_PASSWORD: ${ANYNOTE_DEV_DB_PASSWORD}
      ANYNOTE_APP_ORIGIN: https://app.anynote.test:18443
      ANYNOTE_API_ISSUER: https://api.anynote.test:18443
      ANYNOTE_RP_ID: app.anynote.test
      ANYNOTE_OAUTH_PRIVATE_KEY: /authkeys/private.pem
      ANYNOTE_OAUTH_PUBLIC_KEY: /authkeys/public.pem
      SESSION_DRIVER: database
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    volumes:
      - ../../apps/api:/app
      - ../../.local/p06/oauth:/authkeys:ro
      - ./p06-pool.conf:/usr/local/etc/php-fpm.d/zz-p06.conf:ro
    networks: [frontend, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
  auth-nginx:
    image: nginx:1.30.5-trixie@sha256:9bf97bd7714f5e24c1ccd545ecb9eb5435cb6d109c97cebb15e7e455e0239edb
    user: "${ANYNOTE_DEV_UID:-1000}:${ANYNOTE_DEV_GID:-1000}"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:18443:8443"]
    volumes:
      - ./p06-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/api/public:/app/public:ro
      - ../../.local/p06/static:/static:ro
      - ../../.local/p06/tls:/tls:ro
    networks: [frontend]
    depends_on: [auth-php]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: none}
