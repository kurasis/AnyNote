pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    client_max_body_size 4m;
    client_body_temp_path /tmp/client;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server { listen 8443 ssl default_server; server_name _; return 404; }
    server {
        listen 8443 ssl;
        server_name api.anynote.test;
        root /app/public;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Cache-Control;
        error_page 413 = @control_too_large;
        location @control_too_large {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param ANYNOTE_EDGE_ERROR request-too-large;
            fastcgi_param CONTENT_LENGTH 0;
            fastcgi_pass_request_body off;
            fastcgi_pass auth-php:9000;
        }
        location ~ "^/api/v1/uploads/[A-Za-z0-9_-]{22}/parts/(0|[1-9][0-9]{0,2})$" {
            client_max_body_size 8388624;
            client_body_buffer_size 64k;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-php:9000;
        }
        location / { try_files $uri /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-php:9000;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name app.anynote.test;
        root /static;
        index index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self'; frame-src 'none'; connect-src https://api.anynote.test:18443; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;
        # Keep the page's API-only policy. Only the static worker can fetch
        # these enumerated application resources, with no API connection.
        location = /auth/sw.js {
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'none'; worker-src 'none'; frame-src 'none'; connect-src https://app.anynote.test:18443/auth/style.css https://app.anynote.test:18443/auth/vault.html https://app.anynote.test:18443/auth/vault.js https://app.anynote.test:18443/auth/vault-worker.js https://app.anynote.test:18443/auth/vault-client.js https://app.anynote.test:18443/auth/vault-store.js https://app.anynote.test:18443/auth/notes.html https://app.anynote.test:18443/auth/notes.js https://app.anynote.test:18443/auth/notes.css; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { return 404; }
    }
}
