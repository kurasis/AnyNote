pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    client_max_body_size 256k;
    client_body_temp_path /tmp/client;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server { listen 8443 ssl default_server; server_name _; return 404; }
    server {
        listen 8443 ssl;
        server_name api.anynote.test;
        root /app/public;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Cache-Control;
        location / { try_files $uri /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-php:9000;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name app.anynote.test;
        root /static;
        index index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self'; frame-src 'none'; connect-src https://api.anynote.test:18443; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { return 404; }
    }
}
