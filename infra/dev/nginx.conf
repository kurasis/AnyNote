pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    client_max_body_size 4m;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server { listen 8080 default_server; server_name _; return 404; }
    server {
        listen 8080;
        server_name api.anynote.test;
        root /app/public;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Cache-Control;
        error_page 413 = @control_too_large;
        location @control_too_large {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param ANYNOTE_EDGE_ERROR request-too-large;
            fastcgi_param CONTENT_LENGTH 0;
            fastcgi_pass_request_body off;
            fastcgi_pass php:9000;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        location / { try_files $uri /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_pass php:9000;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { return 404; }
    }
    server {
        listen 8080;
        server_name app.anynote.test;
        root /static;
        index index.html;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { return 404; }
    }
}
