services:
  db:
    image: mariadb:11.8.9-noble@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    environment:
      MARIADB_DATABASE: anynote_synthetic
      MARIADB_USER: anynote_dev
      MARIADB_PASSWORD: ${ANYNOTE_DEV_DB_PASSWORD:?Run scripts/dev-stack.py install first}
      MARIADB_ROOT_PASSWORD: ${ANYNOTE_DEV_ROOT_PASSWORD:?Run scripts/dev-stack.py install first}
    volumes:
      - db-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 2s
      retries: 30
    logging:
      driver: none
  php:
    build:
      context: ./php
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    image: anynote-p03-php:8.4.26
    user: "${ANYNOTE_DEV_UID:-1000}:${ANYNOTE_DEV_GID:-1000}"
    environment:
      APP_ENV: local
      APP_KEY: ${ANYNOTE_DEV_APP_KEY:?Run scripts/dev-stack.py install first}
      APP_DEBUG: "false"
      APP_URL: http://api.anynote.test:${ANYNOTE_DEV_PORT:-18080}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: anynote_synthetic
      DB_USERNAME: anynote_dev
      DB_PASSWORD: ${ANYNOTE_DEV_DB_PASSWORD}
      LOG_CHANNEL: "null"
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      COMPOSER_HOME: /tmp/composer
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ../../apps/api:/app
    networks: [frontend, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: none
  nginx:
    image: nginx:1.30.5-trixie@sha256:9bf97bd7714f5e24c1ccd545ecb9eb5435cb6d109c97cebb15e7e455e0239edb
    user: "${ANYNOTE_DEV_UID:-1000}:${ANYNOTE_DEV_GID:-1000}"
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - "127.0.0.1:${ANYNOTE_DEV_PORT:-18080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/api/public:/app/public:ro
      - ./static:/static:ro
    networks: [frontend]
    depends_on: [php]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
networks:
  frontend: {}
  database:
    internal: true
volumes:
  db-data: {}
