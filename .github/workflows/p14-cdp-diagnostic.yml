name: P14 isolated actual WebView2 CDP diagnosis
on:
  push:
    branches: [ci/p14-root-trust-probe-20261015]
permissions:
  contents: read
  actions: read
jobs:
  cdp-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38699387899'
          name: p14-ci-harness-diagnosis-not-owner-installer
          path: .local/cdp-harness
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38699387899'
          name: p14-windows-development-installer
          path: .local/cdp-owner
      - name: Observe actual process HWND CDP and browser arguments
        shell: python
        run: |
          import os,json,subprocess,time,hashlib,urllib.request
          from pathlib import Path
          assert os.name=='nt' and os.environ.get('GITHUB_ACTIONS')=='true'
          r=Path.cwd();work=r/'.local/cdp-diagnostic';assert not work.exists();work.mkdir()
          install=work/'installed'
          setup=next((r/'.local/cdp-owner').rglob('*setup.exe'));harness=next((r/'.local/cdp-harness').rglob('*.exe'))
          report={'purpose':'P14 exact compiled Windows harness infrastructure diagnosis; no API/account/private profile; not app or physical acceptance','diagnostic_source_commit':os.environ['GITHUB_SHA'],'binary_source_commit':'db8658f534f8427560a25711653318972a0c963e','harness_sha256':hashlib.sha256(harness.read_bytes()).hexdigest(),'physical_acceptance':False,'modes':[]}
          subprocess.run([str(setup),'/S','/D='+str(install)],check=True,timeout=180)
          owner=next(p for p in install.glob('*.exe') if 'uninstall' not in p.name.lower());owner.write_bytes(harness.read_bytes())
          for mode in ['arguments','arguments-explicit-directory']:
            env=os.environ.copy();env['WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS']='--remote-debugging-port=9223 --remote-debugging-address=127.0.0.1'
            if mode.endswith('explicit-directory'):env['WEBVIEW2_USER_DATA_FOLDER']=str(work/'explicit-browser-data')
            app=subprocess.Popen([str(owner)],env=env,stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            observed={'mode':mode,'pid':app.pid,'cdp':False}
            try:
              deadline=time.monotonic()+22
              while time.monotonic()<deadline and app.poll() is None:
                try:
                  with urllib.request.urlopen('http://127.0.0.1:9223/json/list',timeout=1) as response:observed['targets']=json.load(response);observed['cdp']=True;break
                except Exception as error:observed['connection_error']=str(error)[:250]
                time.sleep(.5)
              observed['exit_code']=app.poll()
              command="$all=Get-CimInstance Win32_Process;$ids=[Collections.Generic.HashSet[int]]::new();[void]$ids.Add("+str(app.pid)+");do{$changed=$false;foreach($p in $all){if($ids.Contains([int]$p.ParentProcessId) -and !$ids.Contains([int]$p.ProcessId)){[void]$ids.Add([int]$p.ProcessId);$changed=$true}}}while($changed);$all|?{$ids.Contains([int]$_.ProcessId)}|%{@{pid=$_.ProcessId;parent=$_.ParentProcessId;name=$_.Name;command_line=$_.CommandLine;hwnd=(Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue).MainWindowHandle.ToInt64()}}|ConvertTo-Json -Depth 4 -Compress"
              processes=subprocess.run(['powershell','-NoProfile','-NonInteractive','-Command',command],stdin=subprocess.DEVNULL,capture_output=True,timeout=20);observed['process_query_exit']=processes.returncode
              observed['processes']=json.loads(processes.stdout) if processes.returncode==0 else processes.stderr.decode(errors='replace')[-1000:]
            finally:
              if app.poll() is None:subprocess.run(['taskkill','/PID',str(app.pid),'/T','/F'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20);app.wait(timeout=10)
              time.sleep(2)
            report['modes'].append(observed)
          report['status']='OBSERVED'
          out=r/'artifacts/p14-cdp-diagnostic';out.mkdir(parents=True);(out/'report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8');print(json.dumps(report))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p14-owned-cdp-diagnostic
          path: artifacts/p14-cdp-diagnostic/report.json
          retention-days: 3
          if-no-files-found: error
