name: Publish exact checked review delivery
on:
  push:
    branches: [publish/review-0.18.0]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-exact-review-0.18.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.14'
      - name: Reconstruct, compare every original digest, upload and publish prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/release-publication/publish.py
      - name: Preserve publication progress and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-review-publication-receipt
          path: ${{ runner.temp }}/anynote-review-publication/*.json
          retention-days: 14
