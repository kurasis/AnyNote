name: P02 candidate protocol contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ANYNOTE_TOOLCHAINS: /tmp/anynote-p02-toolchains
      NPM_CONFIG_CACHE: /tmp/anynote-p02-npm
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.14'
      - name: Activate checksum-verified repository toolchains
        run: bash scripts/install-p01-toolchains.sh
      - name: Install exact candidate dependencies without lifecycle scripts
        run: |
          source scripts/runtime-env.sh
          npm --prefix packages/protocol ci --ignore-scripts --cache "$NPM_CONFIG_CACHE" --no-audit --no-fund
      - name: Install frozen P03 client/typecheck dependencies
        run: |
          source scripts/runtime-env.sh
          npm --prefix packages/api-client ci --ignore-scripts --cache "$NPM_CONFIG_CACHE" --no-audit --no-fund
      - name: Verify P03 generation, real drift negatives and typed boundaries
        run: |
          source scripts/runtime-env.sh
          python3 scripts/p03-contracts.py
          python3 scripts/check-p03-drift.py
          npm --prefix packages/api-client run lint
          npm --prefix packages/api-client run typecheck
          npm --prefix packages/api-client test
          npm --prefix packages/api-client audit --cache "$NPM_CONFIG_CACHE" --audit-level=low
      - name: Install checksum-pinned independent age engines
        run: python3 scripts/install-p02-tools.py
      - name: Validate candidate parser, context, fixture and dependency drift
        run: |
          source scripts/runtime-env.sh
          npm --prefix packages/protocol test
          npm --prefix packages/protocol run fixtures:check
          npm --prefix packages/protocol run crypto:check
          npm --prefix packages/protocol run state:check
          npm --prefix packages/protocol run group:check
          npm --prefix packages/protocol run complete:check
          python3 scripts/check-p02-portability.py
          npm --prefix packages/protocol run inventory:check
          npm --prefix packages/protocol audit --cache "$NPM_CONFIG_CACHE" --audit-level=low
          python3 scripts/check-p02-fixtures.py
          python3 scripts/check_baseline.py
          git diff --exit-code
