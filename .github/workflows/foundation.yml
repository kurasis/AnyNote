name: P03 development foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.14'
      - name: Verify baseline, locked inventory and actual secret-scanner negative case
        run: |
          python3 scripts/check_baseline.py
          python3 scripts/api-inventory.py
          python3 scripts/install-p03-tools.py
          python3 scripts/install-p02-tools.py
          python3 scripts/check-secrets.py
      - name: Install checksum-verified Node and frozen HTTP-client dependencies
        run: |
          bash scripts/install-p01-toolchains.sh
          source scripts/runtime-env.sh
          npm --prefix packages/protocol ci --ignore-scripts --cache /tmp/p03-npm --no-audit --no-fund
          npm --prefix packages/api-client ci --ignore-scripts --cache /tmp/p03-npm --no-audit --no-fund
          python3 scripts/p03-contracts.py
      - name: Install frozen dependencies and build verified images
        run: python3 scripts/dev-stack.py install
      - name: Run actual Laravel/MariaDB/FPM/Nginx integration
        run: |
          python3 scripts/dev-stack.py up
          python3 scripts/dev-stack.py test
          source scripts/runtime-env.sh
          node packages/api-client/http-check.mjs
      - name: Verify independent PHP public candidate crypto fixtures
        run: |
          python3 scripts/check-p02-crypto.py
          python3 scripts/check-p02-state.py
          python3 scripts/check-p02-group.py
          python3 scripts/check-p02-complete.py
          python3 scripts/check-p02-v1-authority.py
      - name: Preserve content-free foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-foundation-report
          path: |
            artifacts/p03/foundation-report.json
            artifacts/p03/http-contract-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop only this checkout's development services
        if: always()
        run: python3 scripts/dev-stack.py stop
