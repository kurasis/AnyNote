name: P01 synthetic feasibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_fixtures:
        description: Generate initial public synthetic fixtures for review
        type: boolean
        default: false
      publish_device_kit:
        description: Publish the already verified P01 device kit (no rebuild or production deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: p01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-device-kit:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_device_kit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kurasis/AnyNote
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Verify source, successful CI and downloaded asset receipts, then publish test artifacts
        run: python3 scripts/publish-p01-device-kit.py

  static-device-kit:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_device_kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANYNOTE_TOOLCHAINS: /tmp/anynote-p01-toolchains
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      ANYNOTE_PROBE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install verified toolchains and locked browser dependencies
        run: |
          bash scripts/install-p01-toolchains.sh
          source scripts/runtime-env.sh
          npm --prefix experiments/p01 ci --no-audit --no-fund
      - name: Exercise one-button kit at a nested static path with sandbox enabled
        run: |
          source scripts/runtime-env.sh
          cd experiments/p01
          node test-device-kit.mjs
      - name: Package root-level iPhone ZIP and verify all receipts
        run: python3 scripts/zip-device-kit.py
      - name: Preserve static kit and actual hosted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-iphone-device-kit
          path: |
            experiments/p01/artifacts/AnyNote-P01-iPhone.zip
            experiments/p01/artifacts/device-kit-report.json
          if-no-files-found: error
          retention-days: 14

  linux-native-browser:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_device_kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANYNOTE_TOOLCHAINS: /tmp/anynote-p01-toolchains
      CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install verified pinned toolchains
        run: bash scripts/install-p01-toolchains.sh
      - name: Install locked JS dependencies and build native experiment
        run: |
          source scripts/runtime-env.sh
          npm --prefix experiments/p01 ci --no-audit --no-fund
          cargo build --manifest-path experiments/p01/native/Cargo.toml --locked --release -j 4
      - name: Native tests and static checks
        run: |
          source scripts/runtime-env.sh
          cargo fmt --manifest-path experiments/p01/native/Cargo.toml --check
          cargo clippy --manifest-path experiments/p01/native/Cargo.toml --locked --release -j 4 -- -D warnings
          cargo test --manifest-path experiments/p01/native/Cargo.toml --locked --release -j 4
          cargo fmt --manifest-path experiments/p01/windows-hello/Cargo.toml --check
          cargo clippy --manifest-path experiments/p01/windows-hello/Cargo.toml --locked --all-targets -j 4 -- -D warnings
          cargo test --manifest-path experiments/p01/windows-hello/Cargo.toml --locked -j 4
      - name: Rust / Node / real Chromium worker and decimal 1 GB
        env:
          RECORD_FIXTURES: ${{ inputs.record_fixtures || false }}
        run: |
          source scripts/runtime-env.sh
          cd experiments/p01
          if [[ "$RECORD_FIXTURES" == true ]]; then
            node run.mjs --large --write-fixtures
          else
            npm run test:large
          fi
      - name: Preserve actual reports and public fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p01-linux-native-browser
          path: |
            experiments/p01/artifacts/*.json
            experiments/p01/fixtures/*.json
          if-no-files-found: error
          retention-days: 14

  windows-provider:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_device_kit
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      ANYNOTE_PROBE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: experiments/p01/windows-hello
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install pinned MSVC Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.99.0
      - name: Independent Microsoft C-header ABI measurements
        run: ./tests/hello/webauthn-layout.ps1
      - name: Build native provider, regression tests and explicit ABI gate
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked generated_layout_matches_the_pinned_microsoft_c_header -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capability-only runtime observation (no native objects created)
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & ./target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe capabilities | Out-File artifacts/capabilities.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe -Algorithm SHA256 | Format-List | Out-File artifacts/executable-sha256.txt
      - name: Validate content-free device collector on the hosted runner
        run: |
          $probe=(Resolve-Path target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe).Path
          $hash=(Get-FileHash $probe -Algorithm SHA256).Hash
          ./scripts/collect-physical.ps1 -Probe $probe -ExpectedSha256 $hash -ExpectedSource $env:ANYNOTE_PROBE_SOURCE -Operation capabilities -EnvironmentKind hosted -OutputDirectory artifacts/hosted-collector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record=Get-Content (Get-ChildItem artifacts/hosted-collector/trial-*.json).FullName -Raw | ConvertFrom-Json
          if ($record.environment_kind -ne 'hosted' -or $record.physical_acceptance -ne $false -or $record.source_commit -ne $env:ANYNOTE_PROBE_SOURCE -or $record.capability.native_objects_created -ne $false) { throw 'Invalid hosted collector record' }
      - name: Exercise built-in single-EXE report without hardware objects
        run: |
          & ./target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe --hosted-local-report | Out-File artifacts/device-kit-hosted.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record=Get-Content artifacts/device-kit-hosted.json -Raw | ConvertFrom-Json
          $hash=(Get-FileHash target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($record.environment_kind -ne 'hosted' -or $record.physical_acceptance -ne $false -or $record.source_commit -ne $env:ANYNOTE_PROBE_SOURCE -or $record.capability.report.native_objects_created -ne $false -or $record.operations.Count -ne 0 -or $record.executable_sha256 -ne $hash) { throw 'Invalid single-EXE hosted record' }
          if ($record.local_checks.status -ne 'PASS' -or $record.local_checks.file.bytes -ne 1000000000 -or $record.local_checks.file.chunks -ne 120 -or $record.local_checks.synthetic_disk_cleanup -ne 'PASS') { throw 'Built-in exact 1 GB local check failed' }
          Copy-Item target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe artifacts/AnyNote-P01-Windows-x64.exe
          ./scripts/check-one-exe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve unsigned synthetic probe and actual capability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p01-windows-synthetic-probe
          path: |
            experiments/p01/windows-hello/target/x86_64-pc-windows-msvc/release/anynote-p01-windows-hello.exe
            experiments/p01/windows-hello/artifacts/*
          if-no-files-found: error
          retention-days: 14
