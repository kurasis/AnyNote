name: P14 public NSIS installer mode control
on:
  push:
    branches: [ci/p14-root-trust-probe-20261015]
permissions:
  contents: read
  actions: read
jobs:
  bridge-startup-probe:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38749347031'
          name: p14-windows-development-installer
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38749347031'
          name: p14-ci-harness-diagnosis-not-owner-installer
          path: .
      - name: Exact NSIS installer modes with public synthetic data
        run: python scripts/p14-public-bridge-probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p14-installer-mode-control-public
          path: artifacts/p14-installer-control/*.json
          retention-days: 3
          if-no-files-found: warn
