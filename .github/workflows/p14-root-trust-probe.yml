name: P14 canonical runtime path red green regression
on:
  push:
    branches: [ci/p14-root-trust-probe-20261015]
permissions:
  contents: read
  actions: read
jobs:
  bridge-startup-probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38719871883'
          name: p14-windows-development-installer
          path: .
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            packages/windows-native/target
          key: windows-p14-bridge-path-diagnostic
          restore-keys: windows-p14-rust199-
      - name: Real bundled helper and canonical path regression before and after fix
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          python scripts/p14-public-bridge-probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

