name: P17 adversarial security evaluation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adversarial-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANYNOTE_TOOLCHAINS: /tmp/anynote-p17-toolchains
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.14'
      - name: Frozen dependencies and owned service prerequisites
        run: |
          bash scripts/install-p01-toolchains.sh
          source scripts/runtime-env.sh
          for package in packages/protocol experiments/p01 packages/api-client apps/devices-web apps/notes-web packages/content-browser; do
            npm --prefix "$package" ci --ignore-scripts --no-audit --no-fund
          done
          python3 scripts/install-p02-tools.py
          python3 scripts/dev-stack.py install
          python3 scripts/dev-stack.py up
          python3 scripts/p06-stack.py up
      - name: Every threat binding, maintained authority and bounded parser mutation
        run: |
          source scripts/runtime-env.sh
          python3 scripts/check-p18.py
          python3 scripts/p17-check.py
          python3 scripts/p17-run.py
          node --expose-gc packages/protocol/security/response-regression.mjs
          node packages/protocol/security/fuzz.mjs
      - name: Separate multi-account SQL, concurrent fault recovery and canary inspection
        run: |
          source scripts/runtime-env.sh
          python3 scripts/p17-stack.py up
          node packages/protocol/security/http.mjs
      - name: Live advisories, actual supported target and exact source receipts
        run: |
          source scripts/runtime-env.sh
          python3 scripts/p17-supply-chain.py
          python3 scripts/p17-evidence.py
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p17-security-report
          path: artifacts/p17/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop only owned processes; preserve synthetic data and prior targets
        if: always()
        run: |
          python3 scripts/p17-stack.py stop
          python3 scripts/p06-stack.py stop
          python3 scripts/dev-stack.py stop
