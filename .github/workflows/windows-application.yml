name: P14 native Windows application development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preserve costly independent exact-source native/GUI runs while a later source queues.
  group: windows-application-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  host-windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            packages/windows-native/target
            apps/desktop/src-tauri/target
          key: windows-p14-rust199-${{ hashFiles('packages/windows-native/Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}-release3
          restore-keys: windows-p14-rust199-${{ hashFiles('packages/windows-native/Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
      - name: Parse native Windows automation before compilation
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/p14-windows-ui.ps1).Path,[ref]$parseTokens,[ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { $_.Message }; throw 'Native automation PowerShell syntax failed' }
      - name: Frozen maintained dependencies and one-installer runtime
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($package in @('packages/protocol','packages/content-browser','experiments/p01','packages/api-client','apps/devices-web','apps/notes-web','apps/desktop')) {
            npm --prefix $package ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          npm --prefix apps/desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python apps/desktop/prepare-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unchanged baseline and closed native capability audit
        run: python scripts/check-p14.py
      - name: Native custody tests and release acceptance driver
        id: native-core
        run: |
          cargo test --manifest-path packages/windows-native/Cargo.toml --locked -j 4 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path packages/windows-native/Cargo.toml --release --features integration-harness --locked -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual owned Windows TLS, PHP and MariaDB
        run: |
          $env:ANYNOTE_TEST_PYTHON = (Get-Command python).Source
          "ANYNOTE_TEST_PYTHON=$env:ANYNOTE_TEST_PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force .local/p14-tools | Out-Null
          rustc scripts/p14-python3-shim.rs -o .local/p14-tools/python3.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc scripts/p14-windows-flush.rs -o .local/p14-tools/flush-volume.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash .local/p14-tools/flush-volume.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding ascii .local/p14-tools/flush-volume.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .local/p14-tools).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python scripts/p14-windows-services.py up
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/p14-windows-services.py diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceChanges = git status --porcelain
          if ($sourceChanges) { $sourceChanges; throw 'Windows backend setup changed the source tree' }
      - name: Verify exact owned Windows CI root before expensive host acceptance
        timeout-minutes: 3
        run: |
          python scripts/p14-windows-services.py trust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Maintained WebView2 single installer
        id: desktop-build
        run: |
          python scripts/p14-dependencies.py --stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/desktop run tauri -- build --ci -- --locked -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-p14.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native Windows enrollment in both QR directions
        run: |
          cargo build --manifest-path packages/windows-native/Cargo.toml --release --features integration-harness --locked -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ANYNOTE_P14_PAIRING_RELEASE = '1'
          node scripts/p14-pairing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native independent cards role loss and ownership
        run: |
          $env:ANYNOTE_P14_PAIRING_RELEASE = '1'
          node scripts/p14-sharing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build separately instrumented real WebView2 host
        run: |
          npm --prefix apps/desktop run tauri -- build --ci --no-bundle --features integration-harness -- --locked -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ephemeral synthetic next-version installer for real updater acceptance
        run: |
          New-Item -ItemType Directory -Force .local/p14-candidate | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/anynote-desktop.exe .local/p14-tools/instrumented-host.exe
          npm --prefix apps/desktop run tauri -- build --ci --config '{"version":"0.14.1"}' -- --locked -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item apps/desktop/src-tauri/target/release/bundle/nsis/*0.14.1*.exe .local/p14-candidate/
          "ANYNOTE_WEBVIEW_TEST_EXE=$((Resolve-Path .local/p14-tools/instrumented-host.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python scripts/check-p14.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceChanges = git status --porcelain
          if ($sourceChanges) { $sourceChanges; throw 'Candidate build changed the source tree' }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && steps.desktop-build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            packages/windows-native/target
            apps/desktop/src-tauri/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Actual installed Windows and WebView2 dialogs lifecycle SQL and 1 GB workflows
        run: |
          node scripts/p14-webview.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native 1 GB transfer export recovery import and token refresh
        run: |
          node scripts/p14-http.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact-source installed-host and installer receipt
        run: python scripts/p14-evidence.py
      - name: Stop only owned Windows services
        if: always()
        timeout-minutes: 5
        run: |
          if (Test-Path .local/p14-windows-services/owner.json) {
            $cleanupCode = 0
            python scripts/p14-windows-services.py diagnose
            if ($LASTEXITCODE -ne 0) { $cleanupCode = $LASTEXITCODE }
            python scripts/p14-windows-services.py untrust
            if ($LASTEXITCODE -ne 0) { $cleanupCode = $LASTEXITCODE }
            python scripts/p14-windows-services.py stop
            if ($LASTEXITCODE -ne 0) { $cleanupCode = $LASTEXITCODE }
            exit $cleanupCode
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p14-windows-development-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/resources/runtime-manifest.json
            artifacts/p14/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve only the compiled CI harness for failed runtime diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: p14-ci-harness-diagnosis-not-owner-installer
          path: .local/p14-tools/instrumented-host.exe
          retention-days: 3
          if-no-files-found: ignore
