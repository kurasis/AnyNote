name: P14 native prefetch framing red green regression
on:
  push:
    branches: [ci/p14-root-trust-probe-20261015]
permissions:
  contents: read
jobs:
  prefetch-regression:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            packages/windows-native/target
          key: windows-p14-prefetch-diagnostic
          restore-keys: windows-p14-rust199-
      - name: Actual inherited-pipe framing counterexample and fixed handler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ANYNOTE_NATIVE_NODE = (Get-Command node).Source
          python scripts/p14-prefetch-regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p14-prefetch-regression-public
          path: artifacts/p14-prefetch/*.json
          retention-days: 3
          if-no-files-found: warn
