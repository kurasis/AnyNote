[package]
name = "anynote-crypto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Strict frozen AnyNote v1 client cryptographic core"

[dependencies]
libsodium-rs = "=0.2.5"
serde = "=1.0.228"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_json_canonicalizer = "=0.3.2"
jsonschema = { version = "=0.58.6", default-features = false }
base64 = "=0.22.1"
hex = "=0.4.3"
hkdf = "=0.13.0"
sha2 = "=0.11.0"
bech32 = "=0.12.0"
aes-gcm = "=0.11.1"
zeroize = "=1.9.1"
